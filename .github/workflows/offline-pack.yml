name: Offline product pack

# Builds the offline product packs for Germany once a week from Open Food Facts' export (all products
# sold in Germany, and German products only), signs them and publishes them to the `offline-pack`
# branch, where the app downloads one on request (raw.githubusercontent.com). It never touches main or
# the app releases.
#
# *Run workflow* with "dry run" (works from any branch): builds both packs without the signing key and
# publishes nothing; the numbers and samples of kept and removed products are in the run's summary and
# its `pack-report` artifact.
#
# One-time setup: docs/CONTRIBUTING.md → "Offline product pack" (signing key, environment, branch).
on:
  schedule:
    - cron: '17 3 * * 1' # Mondays 03:17 UTC; Open Food Facts updates its export daily
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: build and report only, sign and publish nothing (works from a branch)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: offline-pack
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # The signing key lives in this environment, which only main may use (Settings → Environments → offline-pack).
    environment: offline-pack
    permissions:
      contents: write # push the offline-pack branch
    steps:
      - name: Signing key present
        env:
          KEY: ${{ secrets.OFFLINE_PACK_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error title=No signing key::Add the OFFLINE_PACK_PRIVATE_KEY secret to the 'offline-pack' environment (docs/CONTRIBUTING.md: Offline product pack)."
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: bash scripts/install-deps.sh
      # The pack uses the app's own checks (src/lib/offlinePack.ts); the tests compile them and prove they work.
      - run: bash scripts/ci-run.sh npm test
      - name: Build and sign the pack
        env:
          OFFLINE_PACK_PRIVATE_KEY: ${{ secrets.OFFLINE_PACK_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # About 1 GB compressed; streamed, never stored unpacked.
          curl -fsSL --retry 3 --retry-delay 30 -A "Tellerwerk offline pack builder (https://github.com/${GITHUB_REPOSITORY})" \
            https://static.openfoodfacts.org/data/en.openfoodfacts.org.products.csv.gz \
            | gzip -dc | node scripts/build-offline-pack.mjs out
      - name: Publish to the offline-pack branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd out
          git init -q -b offline-pack
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Offline pack from ${GITHUB_SHA::7}"
          # One commit, force-pushed: the branch never grows with old packs.
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" offline-pack
          echo "Published to the offline-pack branch" >> "$GITHUB_STEP_SUMMARY"

  dry-run:
    if: ${{ inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: bash scripts/install-deps.sh
      - run: bash scripts/ci-run.sh npm test
      - name: Build both packs (dry run)
        env:
          OFFLINE_PACK_REPORT: pack-report
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 30 -A "Tellerwerk offline pack builder (https://github.com/${GITHUB_REPOSITORY})" \
            https://static.openfoodfacts.org/data/en.openfoodfacts.org.products.csv.gz \
            | gzip -dc | node scripts/build-offline-pack.mjs --dry-run out
      - uses: actions/upload-artifact@v6
        with:
          name: pack-report
          path: pack-report/report.md
