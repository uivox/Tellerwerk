name: Build apps

# Every push to main builds an Android APK and an iPhone IPA and publishes them
# as a GitHub release (version 1.0.<run number>). Public repos build for free.
#
# Test builds: *Run workflow* on any other branch builds the same files but publishes nothing.
# The APK and IPA are only kept as this run's artifacts (Actions → the run → Artifacts, 14 days),
# for testing native changes (widgets, icons, new native modules) before they are merged.
#
# A release is only published when the type check and tests pass and the Android APK is signed
# with the project's own key (never the public debug key). Required repository secrets
# (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64    base64 of the release keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          key alias
#   ANDROID_KEY_PASSWORD       key password (optional, defaults to the keystore password)
on:
  push:
    branches: [main]
    # Web-only files don't change the apps, so they don't trigger a release.
    paths-ignore: ['**.md', 'docs/**', 'public/**', '**/*.web.ts', '**/*.web.tsx', 'scripts/web-pwa.mjs', '.github/workflows/web.yml']
  workflow_dispatch:

# Read-only by default; only the release job gets write access.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  # Type check and logic tests run alongside the builds; the release waits for them.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: bash scripts/install-deps.sh
      - run: bash scripts/ci-run.sh npx tsc --noEmit
      - run: bash scripts/ci-run.sh npm test

  android:
    runs-on: ubuntu-latest
    strategy:
      # During the move to Tellerwerk, every release also builds the last OpenPlate: the same code
      # under the old app id (APP_VARIANT=openplate, see app.config.js), which installs over OpenPlate
      # and shows the move notice. Drop the OpenPlate entry once the move period is over (claude/RENAME.md).
      matrix:
        include:
          - app: Tellerwerk
            variant: ''
          - app: OpenPlate
            variant: openplate
    env:
      APP_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Restore the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error title=Missing signing key::Add the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS secrets. Release APKs are no longer signed with the public debug key."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - run: bash scripts/install-deps.sh
      - run: node scripts/set-version.mjs
      - run: bash scripts/ci-run.sh npx expo prebuild --platform android --no-install --clean
      - name: Build release APK
        working-directory: android
        env:
          OPENPLATE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          OPENPLATE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          OPENPLATE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          OPENPLATE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash ../scripts/ci-run.sh ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - run: cp android/app/build/outputs/apk/release/app-release.apk ${{ matrix.app }}.apk
      - name: Refuse APKs signed with the debug key
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          CERTS=$("$APKSIGNER" verify --print-certs ${{ matrix.app }}.apk)
          echo "$CERTS"
          if echo "$CERTS" | grep -q "CN=Android Debug"; then
            echo "::error title=Debug-signed APK::The APK is signed with the public debug key."
            exit 1
          fi
      - run: rm -f "$RUNNER_TEMP/release.jks"
        if: always()
      - uses: actions/upload-artifact@v6
        with:
          name: android-${{ matrix.app }}
          path: ${{ matrix.app }}.apk
          retention-days: 14

  ios:
    # Expo SDK 56+ needs Xcode 26.4 or newer; macos-15 only has up to 26.3.
    runs-on: macos-26
    strategy:
      # During the move to Tellerwerk, every release also builds the last OpenPlate: the same code
      # under the old app id (APP_VARIANT=openplate, see app.config.js), which installs over OpenPlate
      # and shows the move notice. Drop the OpenPlate entry once the move period is over (claude/RENAME.md).
      matrix:
        include:
          - app: Tellerwerk
            variant: ''
          - app: OpenPlate
            variant: openplate
    env:
      APP_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: bash scripts/install-deps.sh
      - run: node scripts/set-version.mjs
      - name: Generate the Xcode project (also runs pod install)
        run: bash scripts/ci-run.sh npx expo prebuild --platform ios --clean
      - name: Drop the push entitlement (free Apple IDs cannot sign it; local notifications still work)
        run: |
          for f in ios/*/*.entitlements; do /usr/libexec/PlistBuddy -c "Delete :aps-environment" "$f" || true; done
      - name: Build unsigned app
        run: |
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          bash scripts/ci-run.sh xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/app.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -quiet
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/app.xcarchive/Products/Applications/*.app Payload/
          zip -qry ${{ matrix.app }}.ipa Payload
      - uses: actions/upload-artifact@v6
        with:
          name: ios-${{ matrix.app }}
          path: ${{ matrix.app }}.ipa
          retention-days: 14

  release:
    # Nothing is published unless type check and tests pass too, and only from main:
    # a run started on another branch is a test build and stops after the artifacts.
    if: github.ref == 'refs/heads/main'
    needs: [check, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          merge-multiple: true
      - id: v
        run: echo "version=$(node scripts/set-version.mjs)" >> "$GITHUB_OUTPUT"
      - run: node scripts/make-source.mjs "${{ steps.v.outputs.version }}" "${{ github.repository }}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.v.outputs.version }}" Tellerwerk.apk Tellerwerk.ipa OpenPlate.apk OpenPlate.ipa source.json \
            --title "Tellerwerk ${{ steps.v.outputs.version }}" \
            --notes "OpenPlate is now Tellerwerk, a new app. To keep your data: in OpenPlate, Profile → Export data; install Tellerwerk; Profile → Import data. Then delete OpenPlate. Your AI key, Open Food Facts login, app lock and offline product data aren't in the backup; set them up again.

          Android: download Tellerwerk.apk on your phone and install it (OpenPlate.apk is the last OpenPlate, which only shows these steps). iPhone: install Tellerwerk in SideStore (source: https://github.com/${{ github.repository }}/releases/latest/download/source.json) or Tellerwerk.ipa. Web: https://tellerwerk-app.github.io/. Built from ${GITHUB_SHA::7}." \
            --latest
