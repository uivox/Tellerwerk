name: Something doesn't work
description: A bug, a crash, or something that looks wrong in the app.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Please don't paste diary data, API keys or passwords here: this page is public.
        Security problems go to [Security → Report a vulnerability](https://github.com/uivox/Tellerwerk/security/advisories/new) instead.
  - type: dropdown
    id: platform
    attributes:
      label: Where does it happen?
      multiple: true
      options:
        - iPhone app
        - Android app
        - Web app in the browser
        - Web app added to the Home Screen
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The app's release (for example 1.0.17, shown on the Releases page you installed from), or for the web app the day you saw it.
      placeholder: "1.0.17"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone or browser
      placeholder: "iPhone 15, iOS 26.1 · Pixel 8, Android 16 · Firefox 145 on Windows"
  - type: textarea
    id: steps
    attributes:
      label: What did you do?
      description: Step by step, so it can be repeated.
      placeholder: |
        1. Diary → Add food: Lunch
        2. Scan the barcode 4000000000000
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
      description: Screenshots help a lot. Cover up anything personal first.
